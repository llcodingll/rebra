version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: rebra
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rebra-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - rebra-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
      - "29093:29093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
      - ./config/server.properties:/etc/kafka/server.properties
    networks:
      - rebra-network
    restart: unless-stopped
    command: >
      sh -c "
      if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
        echo 'KRaft 클러스터 초기화 중...'
        KAFKA_CLUSTER_ID=\$$(kafka-storage random-uuid)
        echo \"생성된 Cluster ID: \$$KAFKA_CLUSTER_ID\"
        kafka-storage format -t \$$KAFKA_CLUSTER_ID -c /etc/kafka/server.properties
        echo 'KRaft 초기화 완료'
      else
        echo 'KRaft 클러스터가 이미 초기화되어 있습니다.'
      fi;
      exec kafka-server-start /etc/kafka/server.properties
      "

  rebra:
    image: rebra-main:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=rebra
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_SERVERS=kafka:9092
      - SERVER_DOMAIN=rebra.site
      - CORS_ALLOWED_ORIGINS=https://rebra.site,https://www.rebra.site
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_MINUTE_TIME=300
      - JWT_REFRESH_TOKEN_MINUTE_TIME=10080
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REDIRECT_URL=https://rebra.site/oauth2/authorization/kakao/callback
      - KAKAO_TOKEN_URL=https://kauth.kakao.com/oauth/token
      - GMS_API_KEY=temp-gms-api-key
      - GMS_GPT_URL=https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions
      - SECURITY_ENCRYPTION_ACCOUNT_HASH_PEPPER=${SECURITY_ENCRYPTION_ACCOUNT_HASH_PEPPER}
      - FSS_API_SERVICE_KEY=${FSS_API_SERVICE_KEY}
      - DDL_AUTO=create
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - rebra-network
    restart: unless-stopped

  backtest:
    image: rebra-calc:latest
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=rebra
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_SERVERS=kafka:9092
      - FSS_API_SERVICE_KEY=${FSS_API_SERVICE_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_MINUTE_TIME=300
      - JWT_REFRESH_TOKEN_MINUTE_TIME=10080
      - SECURITY_ENCRYPTION_ACCOUNT_HASH_PEPPER=${SECURITY_ENCRYPTION_ACCOUNT_HASH_PEPPER}
      - GMS_API_KEY=temp-gms-api-key
      - GMS_GPT_URL=https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions
      - DDL_AUTO=create
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - rebra-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  rebra-network:
    driver: bridge