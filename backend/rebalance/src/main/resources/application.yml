spring:
  application:
    name: rebalance

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_schema: rebalance
        format_sql: true
    show-sql: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rebra}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: rebalance-executor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.rebra.rebalance.infrastructure.kafka.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8082

kafka:
  topics:
    rebalancing-orders: rebalancing-orders
    rebalancing-results: rebalancing-results
