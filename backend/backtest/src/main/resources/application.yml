spring:
  application:
    name: rebra-cal-server
  
  # Kafka 설정
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: backtest-calculator
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.rebra.calculator.dto
        spring.json.type.mapping: BacktestRequest:com.rebra.calculator.dto.BacktestRequest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Jackson 설정 (날짜 타입 처리)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# 애플리케이션 설정
server:
  port: 8081

# 액추에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

# 로깅 설정
logging:
  level:
    com.rebra.calculator: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 토픽 설정
kafka:
  topics:
    backtest-request: backtest-request
    backtest-result: backtest-result