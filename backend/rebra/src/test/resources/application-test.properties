# Test Configuration for Realtime WebSocket Tests

# Database (H2 in-memory for tests)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Logging levels for testing
logging.level.com.rebra=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# WebSocket configuration
spring.websocket.allowed-origins=*
spring.websocket.sockjs.enabled=true

# Redis (disabled for tests)
spring.session.store-type=none

# KIS API (mock configuration)
kis.api.enabled=false
kis.websocket.enabled=false

# Security (disabled for tests)
security.jwt.secret=test-secret-key-for-testing-purposes-only
security.jwt.expiration=3600000

# Async executor configuration for tests
async.executor.core-pool-size=2
async.executor.max-pool-size=4
async.executor.queue-capacity=10