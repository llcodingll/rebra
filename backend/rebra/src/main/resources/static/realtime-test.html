<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 KIS 실시간 데이터 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .title {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #666;
        }
        
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        
        .section-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #495057;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .input-group select,
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 1em;
        }
        
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #1e7e34; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        
        .status-panel {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .status.connected { color: #28a745; }
        .status.disconnected { color: #dc3545; }
        
        .data-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .data-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
            min-height: 400px;
        }
        
        .data-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #495057;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .data-content {
            font-family: 'Courier New', monospace;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            max-height: 350px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .log-time {
            color: #6c757d;
            font-size: 0.8em;
        }
        
        .log-data {
            color: #495057;
            margin-top: 2px;
        }
        
        @media (max-width: 768px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
            
            .data-display {
                grid-template-columns: 1fr;
            }
        }
        
        .highlight { background-color: #fff3cd; }
        .error { color: #dc3545; font-weight: bold; }
        .success { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🚀 KIS 실시간 데이터 테스트</h1>
            <p class="subtitle">한국투자증권 실시간 체결가 & 호가 Raw 데이터 테스트</p>
        </div>
        
        <div class="status-panel">
            <div class="status" id="connectionStatus">❌ 연결되지 않음</div>
            <div style="margin-top: 10px;">
                <span id="subscriptionInfo">구독 상태: 없음</span>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="control-section">
                <div class="section-title">📡 연결 제어</div>
                <button class="btn btn-success" onclick="connect()">WebSocket 연결</button>
                <button class="btn btn-danger" onclick="disconnect()">연결 해제</button>
            </div>
            
            <div class="control-section">
                <div class="section-title">📈 실시간 구독</div>
                <div class="input-group">
                    <label for="stockCodeInput">종목코드</label>
                    <select id="stockCodeInput">
                        <option value="005930">005930 (삼성전자)</option>
                        <option value="000660">000660 (SK하이닉스)</option>
                        <option value="035420">035420 (NAVER)</option>
                        <option value="005490">005490 (POSCO홀딩스)</option>
                        <option value="068270">068270 (셀트리온)</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="subscribePrice()">실시간 체결가 구독</button>
                <button class="btn btn-info" onclick="subscribeOrderbook()">실시간 호가 구독</button>
                <button class="btn btn-danger" onclick="unsubscribeAll()">모든 구독 해제</button>
            </div>
            
            <div class="control-section">
                <div class="section-title">🧪 테스트</div>
                <button class="btn btn-info" onclick="clearLogs()">로그 초기화</button>
            </div>
        </div>
        
        <div class="data-display">
            <div class="data-section">
                <div class="data-title">📊 실시간 체결가 (H0STCNT0)</div>
                <div class="data-content" id="priceData"></div>
            </div>
            
            <div class="data-section">
                <div class="data-title">📋 실시간 호가 (H0UNASP0)</div>
                <div class="data-content" id="orderbookData"></div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let priceSubscription = null;
        let orderbookSubscription = null;
        let heartbeatSubscription = null;
        let recoverySubscription = null;
        let currentStockCode = null;
        let reconnectionAttempts = 0;
        let maxReconnectionAttempts = 3;
        let reconnectionDelay = 5000;
        let lastHeartbeat = null;
        let heartbeatTimeout = null;

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = new StompJs.Client({
                webSocketFactory: () => socket,
                debug: (str) => {
                    console.log('STOMP Debug:', str);
                },
                onConnect: (frame) => {
                    console.log('Connected: ' + frame);
                    updateConnectionStatus(true);
                    reconnectionAttempts = 0;
                    setupHeartbeat();
                    setupRecoveryListener();
                },
                onStompError: (frame) => {
                    console.error('Broker reported error: ' + frame.headers['message']);
                    console.error('Additional details: ' + frame.body);
                    updateConnectionStatus(false);
                    attemptReconnection();
                },
                onWebSocketClose: () => {
                    console.log('WebSocket connection closed');
                    updateConnectionStatus(false);
                    attemptReconnection();
                }
            });

            stompClient.activate();
        }

        function disconnect() {
            if (stompClient !== null) {
                unsubscribeAll();
                stompClient.deactivate();
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connectionStatus');
            if (connected) {
                statusElement.textContent = '✅ 연결됨';
                statusElement.className = 'status connected';
            } else {
                statusElement.textContent = '❌ 연결되지 않음';
                statusElement.className = 'status disconnected';
                updateSubscriptionInfo('구독 상태: 없음');
            }
        }

        function updateSubscriptionInfo(info) {
            document.getElementById('subscriptionInfo').textContent = info;
        }

        function subscribePrice() {
            if (stompClient === null || !stompClient.connected) {
                alert('먼저 WebSocket에 연결해주세요.');
                return;
            }

            const stockCode = document.getElementById('stockCodeInput').value;
            currentStockCode = stockCode;

            // 기존 구독 해제
            if (priceSubscription) {
                priceSubscription.unsubscribe();
            }

            // 실시간 체결가 구독 (사용자 ID는 임시로 1 사용)
            const userId = 1; // TODO: 실제 로그인된 사용자 ID 사용
            priceSubscription = stompClient.subscribe(`/topic/stock/${userId}/${stockCode}/price`, (message) => {
                const data = JSON.parse(message.body);
                displayPriceData(data);
            });

            addLog('priceData', `체결가 구독 시작: ${stockCode}`, 'success');
            updateSubscriptionInfo(`체결가 구독 중: ${stockCode}`);
        }

        function subscribeOrderbook() {
            if (stompClient === null || !stompClient.connected) {
                alert('먼저 WebSocket에 연결해주세요.');
                return;
            }

            const stockCode = document.getElementById('stockCodeInput').value;
            currentStockCode = stockCode;

            // 기존 구독 해제
            if (orderbookSubscription) {
                orderbookSubscription.unsubscribe();
            }

            // 실시간 호가 구독 (사용자 ID는 임시로 1 사용)
            const userId = 1; // TODO: 실제 로그인된 사용자 ID 사용
            orderbookSubscription = stompClient.subscribe(`/topic/stock/${userId}/${stockCode}/orderbook`, (message) => {
                const data = JSON.parse(message.body);
                displayOrderbookData(data);
            });

            addLog('orderbookData', `호가 구독 시작: ${stockCode}`, 'success');
            updateSubscriptionInfo(`호가 구독 중: ${stockCode}`);
        }

        function unsubscribeAll() {
            if (priceSubscription) {
                // 구독 해제 메시지 전송
                if (currentStockCode && stompClient && stompClient.connected) {
                    const userId = 1; // TODO: 실제 로그인된 사용자 ID 사용
                    stompClient.publish({
                        destination: `/app/unsubscribe/${userId}/${currentStockCode}`,
                        body: 'price'
                    });
                }
                priceSubscription.unsubscribe();
                priceSubscription = null;
            }

            if (orderbookSubscription) {
                // 구독 해제 메시지 전송
                if (currentStockCode && stompClient && stompClient.connected) {
                    const userId = 1; // TODO: 실제 로그인된 사용자 ID 사용
                    stompClient.publish({
                        destination: `/app/unsubscribe/${userId}/${currentStockCode}`,
                        body: 'orderbook'
                    });
                }
                orderbookSubscription.unsubscribe();
                orderbookSubscription = null;
            }

            updateSubscriptionInfo('구독 상태: 없음');
            addLog('priceData', '모든 구독 해제됨', 'error');
            addLog('orderbookData', '모든 구독 해제됨', 'error');
        }

        // 재연결 로직
        function attemptReconnection() {
            if (reconnectionAttempts >= maxReconnectionAttempts) {
                addLog('priceData', `재연결 한계 초과 (${maxReconnectionAttempts}회)`, 'error');
                return;
            }

            reconnectionAttempts++;
            addLog('priceData', `재연결 시도 ${reconnectionAttempts}/${maxReconnectionAttempts}`, 'error');

            setTimeout(() => {
                if (stompClient && !stompClient.connected) {
                    connect();
                }
            }, reconnectionDelay * reconnectionAttempts);
        }

        // 하트비트 설정
        function setupHeartbeat() {
            if (heartbeatSubscription) {
                heartbeatSubscription.unsubscribe();
            }

            // 세션별 하트비트 채널 구독
            const sessionId = stompClient.ws._transport.url.split('/').pop().split('/')[0];
            heartbeatSubscription = stompClient.subscribe(`/topic/heartbeat/${sessionId}`, (message) => {
                const heartbeatData = JSON.parse(message.body);
                handleHeartbeat(heartbeatData);
            });

            addLog('priceData', '하트비트 모니터링 시작', 'success');
        }

        // 하트비트 처리
        function handleHeartbeat(data) {
            lastHeartbeat = data.timestamp;
            
            // 하트비트 타임아웃 재설정
            if (heartbeatTimeout) {
                clearTimeout(heartbeatTimeout);
            }
            
            heartbeatTimeout = setTimeout(() => {
                addLog('priceData', '하트비트 타임아웃 - 연결 확인 필요', 'error');
                if (stompClient && stompClient.connected) {
                    // 연결 상태 확인을 위한 핑 전송
                    checkConnection();
                }
            }, 60000); // 1분 타임아웃

            updateSubscriptionInfo(`하트비트: ${new Date(data.timestamp).toLocaleTimeString()}`);
        }

        // 연결 상태 확인
        function checkConnection() {
            try {
                if (stompClient && stompClient.connected) {
                    // 더미 메시지 전송으로 연결 상태 확인
                    stompClient.publish({
                        destination: '/app/ping',
                        body: JSON.stringify({ timestamp: Date.now() })
                    });
                } else {
                    attemptReconnection();
                }
            } catch (error) {
                console.error('연결 확인 실패:', error);
                attemptReconnection();
            }
        }

        // 복구 리스너 설정
        function setupRecoveryListener() {
            if (recoverySubscription) {
                recoverySubscription.unsubscribe();
            }

            const sessionId = stompClient.ws._transport.url.split('/').pop().split('/')[0];
            recoverySubscription = stompClient.subscribe(`/topic/recovery/${sessionId}`, (message) => {
                const recoveryData = JSON.parse(message.body);
                handleRecovery(recoveryData);
            });
        }

        // 복구 처리
        function handleRecovery(data) {
            addLog('priceData', `구독 복구 알림: ${data.stockCode} (${data.dataType})`, 'success');
            
            // 자동 재구독
            if (data.dataType === 'price') {
                setTimeout(() => subscribePrice(), 1000);
            } else if (data.dataType === 'orderbook') {
                setTimeout(() => subscribeOrderbook(), 1000);
            }
        }

        function displayPriceData(data) {
            const content = {
                '종목코드': data.stockCode,
                '데이터타입': data.dataType,
                'TR ID': data.trId,
                '타임스탬프': new Date(data.timestamp).toLocaleTimeString(),
                'Raw 데이터': data.rawData,
                '처리된 데이터': JSON.stringify(data.data, null, 2)
            };

            addLog('priceData', JSON.stringify(content, null, 2), 'highlight');
        }

        function displayOrderbookData(data) {
            const content = {
                '종목코드': data.stockCode,
                '데이터타입': data.dataType,
                'TR ID': data.trId,
                '타임스탬프': new Date(data.timestamp).toLocaleTimeString(),
                'Raw 데이터': data.rawData,
                '처리된 데이터': JSON.stringify(data.data, null, 2)
            };

            addLog('orderbookData', JSON.stringify(content, null, 2), 'highlight');
        }

        function addLog(elementId, message, className = '') {
            const logContainer = document.getElementById(elementId);
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry ' + className;
            
            const timeSpan = document.createElement('div');
            timeSpan.className = 'log-time';
            timeSpan.textContent = new Date().toLocaleTimeString();
            
            const dataSpan = document.createElement('div');
            dataSpan.className = 'log-data';
            dataSpan.textContent = message;
            
            logEntry.appendChild(timeSpan);
            logEntry.appendChild(dataSpan);
            
            logContainer.insertBefore(logEntry, logContainer.firstChild);
            
            // 최대 50개 로그 유지
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function clearLogs() {
            document.getElementById('priceData').innerHTML = '';
            document.getElementById('orderbookData').innerHTML = '';
        }

        // 페이지 로드 시 자동 연결
        window.addEventListener('load', function() {
            console.log('📊 KIS 실시간 데이터 테스트 페이지 로드됨');
        });

        // 페이지 언로드 시 연결 해제
        window.addEventListener('beforeunload', function() {
            if (stompClient !== null) {
                disconnect();
            }
        });
    </script>
</body>
</html>
