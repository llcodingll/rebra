spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rebra}?sslmode=disable&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # 커넥션 풀 설정
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: rebra-main-server
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}

# JWT 설정
jwt:
  secret-key: ${JWT_SECRET_KEY}
  ACCESS_TOKEN_MINUTE_TIME: ${JWT_ACCESS_TOKEN_MINUTE_TIME:30}
  REFRESH_TOKEN_MINUTE_TIME: ${JWT_REFRESH_TOKEN_MINUTE_TIME:10080}

# Kakao OAuth2 설정
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-url: ${KAKAO_REDIRECT_URL}
  client-secret: ${KAKAO_CLIENT_SECRET}
  token-url: ${KAKAO_TOKEN_URL:https://kauth.kakao.com/oauth/token}

# GMS API 설정
gms:
  api-key: ${GMS_API_KEY}
  whisper-url: ${GMS_WHISPER_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/audio/transcriptions}
  gpt-url: ${GMS_GPT_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}

deepsearch:
  api:
    key: ${DEEP_SEARCH_KEY}

# 계좌 암호화 설정
security:
  encryption:
    account:
      hash-pepper: ${SECURITY_ENCRYPTION_ACCOUNT_HASH_PEPPER}

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

# 금융위원회 api
fss:
  api:
    base-url: "https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService"
    market-index-base-url: "https://apis.data.go.kr/1160100/service/GetMarketIndexInfoService"
    service-key: "${FSS_API_SERVICE_KEY:}"
    timeout: 30000
    max-retries: 3
    retry-delay: 1000

# 로깅 설정
logging:
  level:
    root: INFO
    com.rebra: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


app:
  frontend-url: ${FRONTEND_URL:https://rebra.site}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://rebra.site}

# 서버 설정
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 20000