# Kafka Server Configuration for Production
# This file is mounted to /etc/kafka/server.properties in the Kafka container
# KRaft mode configuration
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:29093
# Listener configurations
listeners=PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
# Log directories
log.dirs=/tmp/kraft-combined-logs
# Topic configurations
auto.create.topics.enable=true
delete.topic.enable=true
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
# Replication and partition settings
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1
# Group coordinator settings
group.initial.rebalance.delay.ms=0
# Log retention and cleanup
log.retention.hours=168
log.retention.bytes=1073741824
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
# Compression
compression.type=producer
# JVM Heap settings (can be overridden by environment variables)
# -Xmx1G -Xms1G
# Metrics
metric.reporters=
metrics.num.samples=2
metrics.recording.level=INFO
metrics.sample.window.ms=30000
# Security (currently using PLAINTEXT for internal communication)
security.protocol=PLAINTEXT
# Performance tuning
num.replica.fetchers=1
replica.fetch.max.bytes=1048576
replica.socket.timeout.ms=30000
replica.socket.receive.buffer.bytes=65536
# Producer configurations
producer.type=async
batch.size=16384
linger.ms=0
buffer.memory=33554432
# Consumer configurations
fetch.min.bytes=1
fetch.wait.max.ms=500
consumer.timeout.ms=-1